global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'flask_app'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['lab-prediction.onrender.com']

  - job_name: 'flask_app_resources'
    metrics_path: '/metrics/resources'
    scheme: 'https'
    static_configs:
      - targets: ['lab-prediction.onrender.com']
  - job_name: 'flask_app_health'
    metrics_path: '/health'
    scheme: 'https'
    static_configs:
      - targets: ['lab-prediction.onrender.com']
