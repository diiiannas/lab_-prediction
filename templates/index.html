<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предсказание</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #2a1a4a 0%, #0a0520 70%);
            color: #f0e6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container { text-align: center; max-width: 600px; width: 100%; }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(180, 130, 255, 0.6);
        }

        .subtitle {
            color: #b8a8d8;
            margin-bottom: 30px;
            font-style: italic;
        }

        .question-form {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .question-form input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            font-size: 1rem;
            border: 2px solid #6a4aa8;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }

        .question-form button {
            padding: 14px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #8a5cff, #5a2ca8);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .ball {
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a2a5a, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(138, 92, 255, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.6);
            animation: float 3s ease-in-out infinite;
        }

        .answer-text {
            font-size: 1.3rem;
            color: #e0d0ff;
            padding: 20px;
            text-shadow: 0 0 10px rgba(200, 170, 255, 0.8);
        }

        .hint { color: #a898c8; font-size: 0.95rem; margin-top: 15px; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ШАР ПРЕДСКАЗАНИЙ</h1>
        <p class="subtitle">ЗАДАЙ ВОПРОС - УЗНАЙ СВОЮ СУДЬБУ</p>

        <form action="/predict" method="post" class="question-form">
            <input type="text" name="question" placeholder="Введите ваш вопрос..." required
                   value="{{ question or '' }}">
            <button type="submit">УЗНАТЬ ОТВЕТ</button>
        </form>

        {% if answer %}
            <div class="answer-block">
                <div class="ball">
                    <span class="answer-text">{{ answer }}</span>
                </div>
                <p class="hint">ВАШ ВОПРОС: <em>«{{ question }}»</em></p>
            </div>
        {% endif %}
    </div>
</body>
</html>
